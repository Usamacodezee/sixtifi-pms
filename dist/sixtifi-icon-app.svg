<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@800&amp;display=swap');
      .icon-bg {
        fill: #0B0B0C;
      }
      .icon-text {
        font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-weight: 800;
        font-size: 64px;
        fill: #FFFFFF;
      }
      .icon-dot {
        fill: #41A4E3;
      }
    </style>
  </defs>
  <rect width="100" height="100" rx="22" class="icon-bg" />
  <rect x="1" y="1" width="98" height="98" rx="21" fill="none" stroke="#334155" stroke-width="1.5" opacity="0.3" />
  <text x="50" y="65" text-anchor="middle" class="icon-text">S<tspan class="icon-dot">.</tspan></text>
</svg>
